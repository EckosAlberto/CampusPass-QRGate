[phases.setup]
nixPkgs = ["php84", "php84Packages.composer", "nodejs_20", "npm-10_x"]

[phases.install]
cmds = ["composer install --no-interaction --no-dev --optimize-autoloader", "npm ci --omit=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "php artisan migrate --force --seed && php artisan serve --host=0.0.0.0 --port=$PORT"
